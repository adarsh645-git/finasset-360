function seededRandom(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function genHistory(endValue, endDateISO, points, seedKey, volatility) {
  var rand = seededRandom(seedKey);
  var values = new Array(points);
  values[points - 1] = endValue;
  for (var i = points - 2; i >= 0; i--) {
    var pct = (rand() - 0.5) * 2 * volatility;
    values[i] = values[i + 1] / (1 + pct);
  }
  var end = new Date(endDateISO + 'T00:00:00');
  var out = [];
  for (var j = points - 1; j >= 0; j--) {
    var d = new Date(end.getFullYear(), end.getMonth() - j, end.getDate());
    out.push({ date: d.toISOString().slice(0, 10), value: Math.round(values[points - 1 - j]) });
  }
  return out;
}

    var total = classTotal(c);

      targetPct: data.targetAllocation[c.id] || 0

  data.liabilityClasses.forEach(function (c) { c.liabilities.forEach(function (l) { if (l.recordedAt > mostRecent) mostRecent = l.recordedAt; }); });

      var label, gx;
      if (x < todayX) {
        var frac = Math.max(0, Math.min(1, (x - padL) / recordedWidth));
        var idx = Math.round(frac * (recorded.length - 1));
        gx = xRec(idx);
        label = fmtDate(recorded[idx].date) + ' · ' + fmtMoney(recorded[idx].value);
      } else {
        var yf = Math.max(0, Math.min(horizon, ((x - todayX) / projectedWidth) * horizon));
        gx = xProj(yf);
        var v = fv(DERIVED.netWorth, DATA.projectionAssumptions.annualGrowth, DATA.projectionAssumptions.monthlyContribution, yf);
        label = Math.round(startYear + yf) + ' · ' + fmtMoney(v);
      }
      guideLine.setAttribute('x1', gx); guideLine.setAttribute('x2', gx); guideLine.setAttribute('opacity', '1');
      readout.setAttribute('x', Math.min(Math.max(gx, padL + 2), W - padR - 90));
      readout.textContent = label;
      readout.setAttribute('opacity', '1');
    });
    overlay.addEventListener('mouseleave', function () {
      guideLine.setAttribute('opacity', '0');
      readout.setAttribute('opacity', '0');
    });
    svg.appendChild(overlay);

    wrapDiv.innerHTML = '';
    wrapDiv.appendChild(svg);

    /* draw-in, once ever per mount point (flagKey), and only on a paint that's allowed to
       consume it (allowDrawIn) — see the call sites below for why. Measuring a polyline only
       works once the SVG is in the document; every call to paint() that can reach this branch
       has already been deferred past a requestAnimationFrame with a document.body.contains
       check (below), so recLine is guaranteed attached here. Any failure still falls back to
       drawing both lines complete instead of leaving the pane blank. */
    if (allowDrawIn && !eDrawFlags[flagKey] && !dReducedMotion()) {
      eDrawFlags[flagKey] = true;
      clipRect.setAttribute('width', '0');
      requestAnimationFrame(function () {
        try {
          var len = recLine.getTotalLength();
          if (!len || !isFinite(len)) throw new Error('no length');
          recLine.style.strokeDasharray = String(len);
          recLine.style.strokeDashoffset = String(len);
          recLine.getBoundingClientRect(); /* force layout before transition */
          recLine.style.transition = 'stroke-dashoffset 600ms ease-out';
          clipRect.style.transition = 'width 600ms ease-out';
          clipRect.style.transitionDelay = '850ms';
          requestAnimationFrame(function () {
            recLine.style.strokeDashoffset = '0';
            clipRect.setAttribute('width', String(W));
          });
        } catch (err) {
          recLine.style.strokeDasharray = '';
          recLine.style.strokeDashoffset = '';
          clipRect.setAttribute('width', String(W));
        }
      });
    } else {
      clipRect.setAttribute('width', String(W));
    }
  }

  /* Immediate synchronous paint so the chart is never blank even for a frame: at this point
     wrapDiv is never attached yet (callers attach the element this function returns), so this
     always uses the cached/fallback width and never the once-per-flagKey draw-in — that's
     reserved for the corrective paint below, once the width is trustworthy. */
  paint(false);
  requestAnimationFrame(function () {
    /* Node is attached by now (eRerender/eBuildDetail/refreshPlanTimeline all attach this
       wrapper synchronously before this callback runs) — but guard anyway: a fast view switch
       could detach it before this frame fires, and measuring/painting a detached node is the
       exact failure mode that blanked a whole pane in an earlier round of this prototype. */
    if (!document.body.contains(wrapDiv)) return;
    paint(true);
  });

  /* Register so a window resize repaints this instance at its new width, debounced (see
     eScheduleTimelineResize). Prune any earlier entries whose wrapDiv has since been detached
     (view switched, or a previous copy of this same mount point was replaced) so the registry
     never grows unbounded across re-renders. */
  eActiveTimelines = eActiveTimelines.filter(function (entry) { return document.body.contains(entry.wrapDiv); });
  eActiveTimelines.push({ flagKey: flagKey, wrapDiv: wrapDiv, paint: function () { paint(true); } });

  return wrapDiv;
}

/* ---------- section builders shared within D ---------- */
function dLabel11(text, iconId) {
  var d = document.createElement('div');
  d.className = 'd-label-11';
  if (iconId) {
    d.classList.add('d-label-11-icon');
    d.appendChild(eIconEl(iconId));
    var span = document.createElement('span');
    span.textContent = text;
    d.appendChild(span);
  } else {
    d.textContent = text;
  }
  return d;
}
function dSection() { var d = document.createElement('div'); d.className = 'd-section'; return d; }
function dKvRow(label, value) {
  var row = document.createElement('div');
  row.className = 'd-kv-row';
  var l = document.createElement('span'); l.className = 'label'; l.textContent = label;
  var v = document.createElement('span'); v.textContent = value;
  row.appendChild(l); row.appendChild(v);
  return row;
}
function dSparklineSVG(history, dashed) {
  var w = 320, h = 72, pad = 6;
  var vals = history.map(function (p) { return p.value; });
  var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
  function x(i) { return pad + (i / (history.length - 1)) * (w - pad * 2); }
  function y(v) { return h - pad - ((v - minV) / ((maxV - minV) || 1)) * (h - pad * 2); }
  var pts = history.map(function (p, i) { return x(i) + ',' + y(p.value); }).join(' ');
  var last = history[history.length - 1];
  var dash = dashed ? ' stroke-dasharray="4 3"' : '';
  var dot = dashed ? '' : '<circle cx="' + x(history.length - 1) + '" cy="' + y(last.value) + '" r="3" style="fill:var(--accent)"></circle>';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" role="img" aria-label="Valuation history">' +
    '<polyline points="' + pts + '" style="fill:none;stroke:var(--accent);stroke-width:' + (dashed ? '1.25' : '1.5') + '"' + dash + '></polyline>' + dot +
    '</svg>';
}
function dBuildHistorySection(history) {
  var section = dSection();
  section.appendChild(dLabel11('Valuation History'));
  var sparkWrap = document.createElement('div');
  sparkWrap.style.marginTop = '10px';
  sparkWrap.innerHTML = dSparklineSVG(history, false);
  section.appendChild(sparkWrap);
  var list = document.createElement('div');
  list.className = 'd-history-list';
  history.slice().reverse().slice(0, 8).forEach(function (p) {
    var item = document.createElement('div');
    item.className = 'd-history-item';
    var d = document.createElement('span'); d.textContent = fmtDate(p.date);
    var v = document.createElement('span'); v.className = 'v'; v.textContent = fmtMoney(p.value);
    item.appendChild(d); item.appendChild(v);
    list.appendChild(item);
  });
  section.appendChild(list);
  return section;
}

/* ---------- Attention (stale valuations) ---------- */
function dBuildAttentionSection() {
  var staleItems = [];
  DATA.assetClasses.forEach(function (cls) {
    cls.holdings.forEach(function (h) {
      var days = dDaysAgo(h.recordedAt);
      if (days > 30) staleItems.push({ label: h.name, days: days, amount: h.valuation, sel: { type: 'holding', classId: cls.id, holdingId: h.id } });

  DATA.liabilityClasses.forEach(function (lc) {

/* ============================================================
   VARIANT E · Miller-column navigation (from C), carrying D's
   information payload. Own DOM, own state. E's breadcrumb is
   built from `eState.path`/`eState.root` directly (below), so
   D's sel-object breadcrumb builder isn't needed here.
   ============================================================ */
var eState = null;
var eRootEl = null;
var eLastColCount = 1;

function renderE(root) {
  eRootEl = root;
  eState = { root: 'portfolio', path: [], checkin: null, lastCommit: null };
  eLastColCount = 1;
  eRerender();
}

/* Bridges D's selection-object shape (used by the dashboard's staleness list, the
   Holdings table, linked-liability/financed-holding lines, etc.) onto E's Miller `path`. */
function eSelect(sel) {
  eState.checkin = null;
  eState.root = 'portfolio';
  if (sel.type === 'portfolio') {
    eState.path = [];
  } else if (sel.type === 'class') {
    eState.path = [{ kind: 'class', id: sel.classId }];
  } else if (sel.type === 'holding') {
    eState.path = [{ kind: 'class', id: sel.classId }, { kind: 'holding', classId: sel.classId, id: sel.holdingId }];
  } else if (sel.type === 'liabilityRoot') {
    eState.path = [{ kind: 'liabilities' }];
  } else if (sel.type === 'liabilityClass') {
    eState.path = [{ kind: 'liabilities' }, { kind: 'liabilityClass', id: sel.liabClassId }];
  } else if (sel.type === 'liability') {
    eState.path = [{ kind: 'liabilities' }, { kind: 'liabilityClass', id: sel.liabClassId }, { kind: 'liability', liabClassId: sel.liabClassId, id: sel.liabilityId }];
  }
  eRerender();
}

/* Commits a new Valuation/balance: history append, DATA mutation, DERIVED recompute, and
   arms the settle-flash for the next render of this item's figure (inline edit commit and
   the Live Estimate "Use as Valuation" action both funnel through this). */
function eCommitValue(item, fieldName, dateFieldName, newValue, newDate, flashKind, flashId) {
  item.history.push({ date: newDate, value: newValue });
  item[fieldName] = newValue;
  item[dateFieldName] = newDate;
  DERIVED = computeDerived(DATA);
  eState.lastCommit = { kind: flashKind, id: flashId };
  eRerender();
}

/* Reusable click-to-edit headline figure (§5). One static <div> (dotted-underline hover
   cue) that swaps for a numeric input + backdating affordance on click; Enter/blur commits,
   Esc cancels, an unparsable value on commit leaves the input open. */
function eEditableFigure(item, fieldName, dateFieldName, figureClass, flashKind) {
  var wrap = document.createElement('div');
  wrap.className = 'e-editable-wrap';
  var flashNow = !!(eState.lastCommit && eState.lastCommit.kind === flashKind && eState.lastCommit.id === item.id);
  if (flashNow) eState.lastCommit = null;

  function renderStatic() {
    wrap.innerHTML = '';
    var fig = document.createElement('div');
    fig.className = figureClass + ' e-editable-figure' + (flashNow ? ' e-settle-flash' : '');
    fig.textContent = fmtMoney(item[fieldName]);
    fig.title = 'Click to edit';
    onActivate(fig, renderEdit);
    wrap.appendChild(fig);
  }

  function renderEdit() {
    wrap.innerHTML = '';
    var input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'decimal';
    input.className = 'e-edit-input ' + figureClass;
    input.value = String(Math.round(item[fieldName]));
    wrap.appendChild(input);

    var chosenDate = DATA.today;
    var backdateLine = document.createElement('div');
    backdateLine.className = 'e-backdate-line';
    var backdateToggle = document.createElement('button');
    backdateToggle.type = 'button';
    backdateToggle.className = 'e-backdate-toggle';
    backdateToggle.textContent = 'for: Today';
    backdateLine.appendChild(backdateToggle);
    wrap.appendChild(backdateLine);
    var dateInput = null;
    backdateToggle.addEventListener('click', function () {
      if (dateInput) { dateInput.focus(); return; }
      dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.max = DATA.today;
      dateInput.value = DATA.today;
      dateInput.className = 'e-backdate-input';
      dateInput.addEventListener('change', function () {
        chosenDate = dateInput.value || DATA.today;
        backdateToggle.textContent = 'for: ' + fmtDate(chosenDate);
      });
      backdateLine.appendChild(dateInput);
      dateInput.focus();
    });

    function commit() {
      var raw = input.value.replace(/,/g, '').trim();
      var parsed = raw === '' ? NaN : parseFloat(raw);
      if (isNaN(parsed)) { input.focus(); input.select(); return; }
      eCommitValue(item, fieldName, dateFieldName, parsed, chosenDate, flashKind, item.id);
    }
    function cancel() { flashNow = false; renderStatic(); }

    wrap.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      else if (e.key === 'Enter' && e.target !== backdateToggle) { e.preventDefault(); commit(); }
    });
    wrap.addEventListener('focusout', function (e) {
      var goingTo = e.relatedTarget;
      if (goingTo && wrap.contains(goingTo)) return;
      commit();
    });

    input.focus();
    input.select();
  }

  renderStatic();
  return wrap;
}

/* Up/Down arrow convenience within a single column (§5) — Tab order already covers
   focus movement; Left/Right stay unbound (no switcher in this file to fight, but no
   column-to-column use for them either). */
function eBindColumnArrowKeys(col) {
  col.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    var rows = Array.prototype.slice.call(col.querySelectorAll('.c-row'));
    var idx = rows.indexOf(document.activeElement);
    if (idx === -1) return;
    var next = idx + (e.key === 'ArrowDown' ? 1 : -1);
    if (next < 0 || next >= rows.length) return;
    e.preventDefault();
    rows[next].focus();
  });
}

function eStartCheckin(mode) {
  var items = mode === 'all' ? eAllHoldings() : eStaleHoldings();
  eState.checkin = { mode: mode, items: items, index: 0, flashId: null, startNetWorth: DERIVED.netWorth, done: false };

}
function eExitCheckin() {
  eState.checkin = null;
  eState.root = 'portfolio';
  eState.path = [];
  eRerender();
}
function eCheckinAdvanceIndex() {
  var ci = eState.checkin;
  if (!ci) return;
  ci.flashId = null;
  ci.index += 1;
  if (ci.index >= ci.items.length) ci.done = true;
  eRerender();
}
function eCheckinCommitAndAdvance(holding, value, date) {
  holding.history.push({ date: date, value: value });
  holding.valuation = value;
  holding.recordedAt = date;
  DERIVED = computeDerived(DATA);
  eState.checkin.flashId = holding.id;
  eRerender();
  var delay = dReducedMotion() ? 0 : 450;
  setTimeout(function () {
    if (!eState.checkin) return;
    eCheckinAdvanceIndex();
  }, delay);
}

/* single persistent handler — Check-in's keyboard surface stays live across every
   eRerender() during a pass, since the DOM (and any per-render listener on it) is torn
   down and rebuilt on every advance. */
document.addEventListener('keydown', function (e) {
  if (!eState || !eState.checkin) return;
  var ci = eState.checkin;
  if (e.key === 'Escape') { e.preventDefault(); eExitCheckin(); return; }
  if (ci.done) {
    if (e.key === 'Enter') { e.preventDefault(); eExitCheckin(); }
    return;
  }
  var holding = ci.items[ci.index].holding;
  if (e.key === 'Enter') {
    e.preventDefault();
    var input = document.getElementById('e-checkin-value-input');
    var raw = input ? input.value.replace(/,/g, '').trim() : '';
    var original = Math.round(holding.valuation);
    var parsed = raw === '' ? NaN : parseFloat(raw);
    if (!isNaN(parsed) && parsed !== original) {
      eCheckinCommitAndAdvance(holding, parsed, DATA.today);
    } else {
      eCheckinAdvanceIndex();
    }
  } else if (e.key === 'l' || e.key === 'L') {
    if (holding.live) {
      e.preventDefault();
      eCheckinCommitAndAdvance(holding, holding.liveEstimate, DATA.today);
    }
  }
});

/* close an open Check-in menu on outside click */
document.addEventListener('click', function (e) {
  var menus = document.querySelectorAll('.e-checkin-menu');
  for (var i = 0; i < menus.length; i++) {
    var m = menus[i];
    if (m.hidden) continue;
    var ctrl = m.parentElement;
    if (!ctrl || !ctrl.contains(e.target)) m.hidden = true;
  }
});

/* ---------- top strip + shell rerender ---------- */
function eBuildTopStrip() {
  var strip = document.createElement('div');
  strip.className = 'e-topstrip';

  var left = document.createElement('div');
  left.className = 'e-topstrip-left';
  var wm = document.createElement('span'); wm.className = 'c-wordmark'; wm.style.padding = '0'; wm.textContent = 'FinAsset 360';
  left.appendChild(wm);

  var portfolioLink = document.createElement('button');
  portfolioLink.type = 'button';
  portfolioLink.className = 'e-root-link' + (eState.root === 'portfolio' ? ' is-active' : '');
  portfolioLink.textContent = 'Portfolio';
  onActivate(portfolioLink, function () { eState.root = 'portfolio'; eState.path = []; eRerender(); });
  left.appendChild(portfolioLink);

  var planLink = document.createElement('button');
  planLink.type = 'button';
  planLink.className = 'e-root-link' + (eState.root === 'plan' ? ' is-active' : '');
  planLink.textContent = 'Plan';
  onActivate(planLink, function () { eState.root = 'plan'; eRerender(); });
  left.appendChild(planLink);

  strip.appendChild(left);

  var right = document.createElement('div');
  right.className = 'e-topstrip-right';

  var nw = document.createElement('button');
  nw.type = 'button';
  nw.className = 'e-nw-readout';
  nw.textContent = 'Net Worth ' + fmtMoney(DERIVED.netWorth);
  onActivate(nw, function () { eState.root = 'portfolio'; eState.path = []; eRerender(); });
  right.appendChild(nw);

  right.appendChild(eBuildCheckinControl());

  strip.appendChild(right);
  return strip;
}

function eRerender() {
  eRootEl.innerHTML = '';

  if (eState.checkin) {
    eRenderCheckin(eRootEl);
    return;
  }

  eRootEl.appendChild(eBuildTopStrip());
  eRootEl.appendChild(eBuildBreadcrumb());

  if (eState.root === 'plan') {
    eRootEl.appendChild(eBuildPlanPage());
    return;
  }

  var cols = document.createElement('div');
  cols.className = 'c-columns';
  var path = eState.path;
  var newColCount = 1 + (path.length >= 1 ? 1 : 0) + (path.length >= 2 && path[0].kind === 'liabilities' ? 1 : 0);

  var col1 = eBuildCol1();
  if (1 > eLastColCount) col1.classList.add('e-col-enter');
  cols.appendChild(col1);
  if (path.length >= 1) {
    var col2 = eBuildCol2();
    if (2 > eLastColCount) col2.classList.add('e-col-enter');
    cols.appendChild(col2);
  }
  if (path.length >= 2 && path[0].kind === 'liabilities') {
    var col3 = eBuildCol3();
    if (3 > eLastColCount) col3.classList.add('e-col-enter');
    cols.appendChild(col3);
  }
  eLastColCount = newColCount;

  cols.appendChild(eBuildDetail());
  eRootEl.appendChild(cols);
}

/* ---------- boot ---------- */
var eAppRoot = document.getElementById('app');
eAppRoot.className = 'variant-c';
renderE(eAppRoot);
</script>
