function seededRandom(seed) {
  var s = 0;
  for (var i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;

}
function genHistory(endValue, endDateISO, points, seedKey, volatility) {
  var rand = seededRandom(seedKey);
  var values = new Array(points);
  values[points - 1] = endValue;
  for (var i = points - 2; i >= 0; i--) {
    var pct = (rand() - 0.5) * 2 * volatility;
    values[i] = values[i + 1] / (1 + pct);
  }
  var end = new Date(endDateISO + 'T00:00:00');
  var out = [];
  for (var j = points - 1; j >= 0; j--) {
    var d = new Date(end.getFullYear(), end.getMonth() - j, end.getDate());
    out.push({ date: d.toISOString().slice(0, 10), value: Math.round(values[points - 1 - j]) });
  }

}

function fv(P, annualRate, monthlyContribution, years) {
  var r = annualRate / 12;
  var n = years * 12;
  var growth = Math.pow(1 + r, n);
  if (r === 0) return P + monthlyContribution * n;
  return P * growth + monthlyContribution * ((growth - 1) / r);
}
function monthlyPayment(P0, annualRate, termMonths) {
  var r = annualRate / 12;
  return P0 * r / (1 - Math.pow(1 + r, -termMonths));
}
function amortizeBalance(currentBalance, annualRate, payment, k) {
  var r = annualRate / 12;
  var growth = Math.pow(1 + r, k);
  var bal = currentBalance * growth - payment * ((growth - 1) / r);
  return Math.max(0, bal);
}
function payoffMonths(currentBalance, annualRate, payment) {
  var r = annualRate / 12;
  var x = (payment / r) / (payment / r - currentBalance);
  return Math.log(x) / Math.log(1 + r);
}

/* ============================================================
   Derived math
   ============================================================ */
function latestVal(item) {
  var v = item.valuations, best = v[0];
  for (var i = 1; i < v.length; i++) if (v[i].date > best.date) best = v[i];
  return best;
}
function usdValue(item) { return latestVal(item).value * FX[item.currency]; }
function daysBetween(isoEarlier, isoLater) {
  var a = new Date(isoEarlier + 'T00:00:00'), b = new Date(isoLater + 'T00:00:00');
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function isStale(iso) { return daysBetween(iso, TODAY) > 30; }
function liveEstimate(item) { return item.symbol ? item.qty * PRICES[item.symbol] : null; }

function allHoldings() { var out = []; ASSET_CLASSES.forEach(function (c) { out = out.concat(c.holdings); }); return out; }
function allLiabilities() { var out = []; LIABILITY_CLASSES.forEach(function (c) { out = out.concat(c.liabilities); }); return out; }

function holdingsTotal() { return allHoldings().reduce(function (s, h) { return s + usdValue(h); }, 0); }
function liabilitiesTotal() { return allLiabilities().reduce(function (s, l) { return s + usdValue(l); }, 0); }
function netWorth() { return holdingsTotal() - liabilitiesTotal(); }
function classTotal(cls) { return cls.holdings.reduce(function (s, h) { return s + usdValue(h); }, 0); }
function liabClassTotal(cls) { return cls.liabilities.reduce(function (s, l) { return s + usdValue(l); }, 0); }
function newestAsOfDate() {
  var best = null;
  allHoldings().concat(allLiabilities()).forEach(function (it) {
    var d = latestVal(it).date;
    if (!best || d > best) best = d;
  });
  return best;
}
function staleItems() {
  return allHoldings().concat(allLiabilities()).filter(function (it) { return isStale(latestVal(it).date); });
}

function distributionRows() {
  var total = holdingsTotal();
  return ASSET_CLASSES.map(function (cls) {
    var ct = classTotal(cls);
    var actualPct = total > 0 ? (ct / total) * 100 : 0;
    return { cls: cls, actualPct: actualPct, targetPct: cls.target, gap: (cls.target - actualPct) / 100 * total };
  });
}

/* recorded net worth history: sum each item's own 24-point genHistory by index (months-ago aligned) */
function recordedNetWorthSeries() {
  var hs = allHoldings(), ls = allLiabilities();
  var out = [];
  for (var i = 0; i < 24; i++) {
    var v = 0;
    hs.forEach(function (h) { v += h.valuations[i].value * FX[h.currency]; });
    ls.forEach(function (l) { v -= l.valuations[i].value * FX[l.currency]; });
    var monthsAgo = 23 - i;
    var d = new Date(TODAY + 'T00:00:00');
    d = new Date(d.getFullYear(), d.getMonth() - monthsAgo, 1);
    out.push({ date: d.toISOString().slice(0, 10), value: v });
  }
  return out;
}

var PROJECTION = { growth: 0.06, contribution: 2500, years: 20 };

function liabilitiesProjected(years) {
  var total = 0;
  LIABILITY_CLASSES.forEach(function (cls) {
    cls.liabilities.forEach(function (l) {
      if (l.amortization) {
        var info = computeAmortizationInfo(l);
        total += amortizeBalance(latestVal(l).value, l.amortization.rate, info.totalPayment, Math.round(years * 12)) * FX[l.currency];
      } else {
        total += usdValue(l);
      }
    });
  });
  return total;
}
function projectedNetWorth(years) {
  return fv(holdingsTotal(), PROJECTION.growth, PROJECTION.contribution, years) - liabilitiesProjected(years);
}
function mortgagePayoffInfo() {
  var m = LIABILITIES_MAP['mortgage-maple'];
  return computeAmortizationInfo(m);
}

function h(tag, attrs, children) {
  var e = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function svgEl(tag, attrs) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function animateDistributionBars(stagger) {
  var fills = document.querySelectorAll('.dist-fill');
  if (reducedMotion()) {
    fills.forEach(function (f) { f.style.width = f.getAttribute('data-target-width') + '%'; });
    return;
  }
  fills.forEach(function (f, i) {
    var target = f.getAttribute('data-target-width') + '%';
    var delay = stagger ? i * 40 : 0;
    setTimeout(function () {
      f.style.transition = 'width 400ms ease-out';
      f.style.width = target;
    }, delay);
  });
}

function updateDistributionBars() {
  var rows = distributionRows();
  var maxVal = 0;
  rows.forEach(function (r) { maxVal = Math.max(maxVal, r.actualPct, r.targetPct); });
  var scale = maxVal > 0 ? 92 / maxVal : 1;
  rows.forEach(function (r) {
    var row = qs('.dist-row[data-class="' + r.cls.id + '"]');
    if (!row) return;
    var fill = row.querySelector('.dist-fill');
    fill.style.transition = 'width 300ms ease-out';
    fill.style.width = (r.actualPct * scale) + '%';
    row.querySelector('.dist-tick').style.left = (r.targetPct * scale) + '%';
    row.querySelector('.actual').textContent = fmtPct(r.actualPct);
    var gapWords = r.gap >= 0 ? (fmtMoney(Math.abs(r.gap)) + ' below target') : (fmtMoney(Math.abs(r.gap)) + ' above target');
    row.querySelector('.dist-line2').textContent = gapWords;
  });
}

function buildSheetTable() {

function itemRow(item, sectionTotal) {

    var span = h('span', { title: title, html: CHAIN_SVG });
    nameLine.appendChild(span);
  }
  nameTd.appendChild(nameLine);
  var hintText = item.symbol ? (formatQty(item.qty) + ' × ' + item.symbol) : (item.hint || null);
  if (hintText) nameTd.appendChild(h('div', { class: 'name-hint' }, [hintText]));
  tr.appendChild(nameTd);

  tr.appendChild(buildValueCell(item, isLiability));

  var usdTd = h('td', { class: 'usd-cell col-usd' + (isLiability ? ' is-liability' : '') }, [fmtMoney(usdValue(item))]);
  tr.appendChild(usdTd);

function formatQty(q) {

function buildValueCell(item, isLiability) {
  var td = h('td', { class: 'value-cell col-value' });

  refreshValBtnLabel(btn, item);
  rest.appendChild(btn);
  var live = liveEstimate(item);
  if (live != null) {
    var pct = ((live - latestVal(item).value) / latestVal(item).value) * 100;
    var sign = pct >= 0 ? '+' : '';
    var hintDiv = h('div', { class: 'live-hint' }, [
      'Live ' + fmtMoney(live) + ' · ' + sign + pct.toFixed(1) + '% ',
      h('button', { onclick: function (e) { e.stopPropagation(); recordLive(item); } }, ['use'])
    ]);
    rest.appendChild(hintDiv);
  }
  td.appendChild(rest);
  return td;
}
function refreshValBtnLabel(btn, item) {
  var v = latestVal(item);

  td.innerHTML = '';

  var text = v.date === TODAY ? 'Today' : fmtDayMonth(v.date);

/* ============================================================

   ============================================================ */
function shakeEl(el) {
  if (reducedMotion()) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}
function settleCell(el) {
  if (reducedMotion()) { return; }
  el.classList.add('cell-settle');
  el.style.background = 'var(--accent-soft)';
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      el.style.background = 'transparent';
    });
  });
  setTimeout(function () { el.classList.remove('cell-settle'); el.style.background = ''; }, 650);
}

function enterEditMode(item, td, opts) {
  opts = opts || {};
  td.classList.add('editing');
  var v = latestVal(item);
  td.innerHTML = '';
  var input = h('input', { class: 'val-input', type: 'text', inputmode: 'decimal' });
  input.value = String(v.value);
  td.appendChild(input);

  var caption = h('div', { class: 'val-caption' });
  var captionBtn = h('button', {}, ['as of today ▾']);
  var dateInput = null;
  captionBtn.addEventListener('click', function () {
    caption.innerHTML = '';
    dateInput = h('input', { class: 'val-date-input', type: 'date', max: TODAY });
    dateInput.value = TODAY;
    caption.appendChild(dateInput);
    dateInput.focus();
  });
  caption.appendChild(captionBtn);
  td.appendChild(caption);

  function getDate() { return dateInput && dateInput.value ? dateInput.value : TODAY; }

  function doCommit() {
    var raw = input.value.replace(/[, ]/g, '');
    var num = parseFloat(raw);
    if (isNaN(num) || num < 0) { shakeEl(input); return null; }
    var date = getDate();
    var latest = latestVal(item);
    var unchanged = (num === latest.value) && (date === TODAY);
    if (!unchanged) {
      var existing = item.valuations.filter(function (vv) { return vv.date === date; })[0];
      if (existing) existing.value = num; else item.valuations.push({ date: date, value: num });
      item.valuations.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    }
    return { recorded: !unchanged };
  }

  function exitToRest() {
    td.classList.remove('editing');
    td.innerHTML = '';
    var rest = h('div', { class: 'val-caption-rest' });
    var btn = h('button', { class: 'val-btn' + (item.kind === 'liability' ? ' is-liability' : ''), onclick: function () { if (!STATE.checkIn) enterEditMode(item, td); } });
    refreshValBtnLabel(btn, item);
    rest.appendChild(btn);
    var live = liveEstimate(item);
    if (live != null) {
      var vv = latestVal(item);
      var pct = ((live - vv.value) / vv.value) * 100;
      var sign = pct >= 0 ? '+' : '';
      rest.appendChild(h('div', { class: 'live-hint' }, [
        'Live ' + fmtMoney(live) + ' · ' + sign + pct.toFixed(1) + '% ',
        h('button', { onclick: function (e) { e.stopPropagation(); recordLive(item); } }, ['use'])
      ]));
    }
    td.appendChild(rest);
    return td.querySelector('.val-btn');
  }

  input.addEventListener('keydown', function (e) {
    if (opts.checkin) {
      if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); var r = doCommit(); if (r) checkinAdvance(-1, r.recorded); return; }
      if (e.key === 'Enter') { e.preventDefault(); var r2 = doCommit(); if (r2) checkinAdvance(1, r2.recorded); return; }
      if ((e.key === 'l' || e.key === 'L') && item.symbol) { e.preventDefault(); input.value = String(liveEstimate(item)); var r3 = doCommit(); if (r3) checkinAdvance(1, r3.recorded); return; }
      if (e.key === 'Escape') { e.preventDefault(); leaveCheckin(); return; }
    } else {
      if (e.key === 'Enter') { e.preventDefault(); var res = doCommit(); if (res) { var btn2 = exitToRest(); if (res.recorded) { settleCell(td); var asof = qs('tr.item-row[data-id="' + item.id + '"] .asof-cell'); if (asof) asof.style.opacity = ''; refreshAfterEdit(item); } } }
      else if (e.key === 'Escape') { e.preventDefault(); exitToRest(); }
    }
  });
  if (!opts.checkin) {
    input.addEventListener('blur', function () {
      if (!td.classList.contains('editing')) return;
      var res = doCommit();
      if (res) { exitToRest(); if (res.recorded) { settleCell(td); refreshAfterEdit(item); } }
    });
  }
  requestAnimationFrame(function () { input.focus(); input.select(); });
  return { input: input, doCommit: doCommit, exitToRest: exitToRest };
}

function recordLive(item) {
  var live = liveEstimate(item);
  if (live == null) return;
  var existing = item.valuations.filter(function (vv) { return vv.date === TODAY; })[0];
  if (existing) existing.value = Math.round(live); else item.valuations.push({ date: TODAY, value: Math.round(live) });
  item.valuations.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  var tr = qs('tr.item-row[data-id="' + item.id + '"]');
  if (tr) {
    var td = tr.querySelector('.value-cell');
    settleCell(td);
    refreshAfterEdit(item);
  }
  if (STATE.drawer && STATE.drawer.item === item) renderDrawerContent();
}

var LAST_CHECKIN = '2026-08-10';

function startCheckin(mode) {
  var ids = mode === 'stale' ? staleItems().map(function (it) { return it.id; }) : STATE.rowOrder.slice();
  if (ids.length === 0) return;

function leaveCheckin() {

}
function clearCheckinRowEdit() {

function reflowSheet() {

function goToCheckinRow(index) {
  var ci = STATE.checkIn;
  if (!ci) return;
  if (index < 0) index = 0;
  if (index >= ci.ids.length) { finishCheckin(); return; }
  ci.index = index;
  clearCheckinRowEdit();
  var id = ci.ids[index];
  var item = itemById(id);

  tr.classList.add('checkin-current');

function checkinAdvance(dir, recorded) {
  var ci = STATE.checkIn;
  if (!ci) return;
  var id = ci.ids[ci.index];
  var tr = qs('tr.item-row[data-id="' + id + '"]');

    var btn = h('button', { class: 'val-btn' + (item.kind === 'liability' ? ' is-liability' : ''), onclick: function () { if (!STATE.checkIn) enterEditMode(item, td); } });
    refreshValBtnLabel(btn, item);
    rest.appendChild(btn);
    td.appendChild(rest);

function finishCheckin() {

  var slot = qs('#checkin-strip-slot');

  var nwAfter = netWorth();

    ]),
    h('div', {}, []),
    h('div', { class: 'checkin-right' }, [h('button', { onclick: doneCheckin }, ['Done'])])
  ]);
  slot.innerHTML = '';

/* ---- sparkline (reused D-variant approach: draw-in after next frame) ---- */
function buildSparklineSVG(history, strokeVar) {
  var w = 360, h2 = 48, pad = 4;
  var vals = history.map(function (p) { return p.value; });
  var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
  function x(i) { return pad + (i / (history.length - 1)) * (w - pad * 2); }
  function y(v) { return h2 - pad - ((v - minV) / ((maxV - minV) || 1)) * (h2 - pad * 2); }
  var pts = history.map(function (p, i) { return x(i) + ',' + y(p.value); }).join(' ');
  var svg = svgEl('svg', { viewBox: '0 0 ' + w + ' ' + h2, width: '100%', height: String(h2), preserveAspectRatio: 'none', role: 'img', 'aria-label': 'History sparkline' });
  var line = svgEl('polyline', { points: pts, fill: 'none', stroke: 'var(' + strokeVar + ')', 'stroke-width': '1.5' });
  svg.appendChild(line);
  var wrap = h('div', { class: 'sparkline-wrap' });
  wrap.appendChild(svg);
  if (!reducedMotion()) {
    requestAnimationFrame(function () {
      try {
        var len = line.getTotalLength();
        if (!len || !isFinite(len)) throw new Error('no length');
        line.style.strokeDasharray = String(len);
        line.style.strokeDashoffset = String(len);
        line.getBoundingClientRect();
        line.style.transition = 'stroke-dashoffset 600ms ease-out';
        requestAnimationFrame(function () { line.style.strokeDashoffset = '0'; });
      } catch (err) { line.style.strokeDasharray = ''; line.style.strokeDashoffset = ''; }
    });
  }
  return wrap;
}
function buildHistoryTable(history) {
  var last12 = history.slice(-12).slice().reverse();
  var table = h('table', { class: 'history-table' });
  last12.forEach(function (p, idx) {
    var item = STATE.drawer.item;
    var tr = h('tr', {});
    tr.appendChild(h('td', {}, [fmtDate(p.date)]));
    tr.appendChild(h('td', {}, [fmtMoney(p.value) + (item.currency !== 'USD' ? ' ' + item.currency : '')]));
    tr.appendChild(h('td', {}, [fmtMoney(p.value * FX[item.currency]) + ' USD']));
    table.appendChild(tr);
  });
  return table;
}

    var netPos = usdValue(hold) - usdValue(item);
    s3.appendChild(h('div', { class: 'drawer-kv' }, [h('span', { class: 'k' }, ['Projected Net Position today']), fmtMoney(netPos)]));
    frag.appendChild(s3);
  }

  var s4 = h('div', { class: 'drawer-section' });
  s4.appendChild(h('div', { class: 'drawer-label' }, ['Amortization Assumptions']));
  var localAm = item.amortization ? {
    rate: item.amortization.rate, original: item.amortization.original, term: item.amortization.term,
    customPayment: item.amortization.customPayment, extra: item.amortization.extra, start: item.amortization.start
  } : null;
  if (!localAm) {
    s4.appendChild(h('div', { class: 'amort-none' }, ['None set · balance held flat in Projection']));
  } else {
    var form = h('div', { class: 'amort-form' });
    var summaryLine = h('div', { class: 'amort-summary' });
    var curveWrap = h('div', {});

    function field(labelText, value, onchange, step) {
      var wrap = h('div', { class: 'amort-field' });
      wrap.appendChild(h('label', {}, [labelText]));
      var input = h('input', { type: 'text', inputmode: 'decimal' });
      input.value = value == null ? '' : String(value);
      input.addEventListener('change', function () { onchange(input.value); recompute(); });
      wrap.appendChild(input);
      return wrap;
    }
    form.appendChild(field('Interest rate %', (localAm.rate * 100).toFixed(3), function (val) { localAm.rate = parseFloat(val) / 100 || 0; }));
    form.appendChild(field('Original amount', localAm.original, function (val) { localAm.original = parseFloat(val) || 0; }));
    form.appendChild(field('Term (months)', localAm.term, function (val) { localAm.term = parseFloat(val) || 1; }));
    form.appendChild(field('Custom monthly payment', localAm.customPayment, function (val) { localAm.customPayment = val === '' ? null : parseFloat(val); }));
    form.appendChild(field('Extra monthly payment', localAm.extra, function (val) { localAm.extra = parseFloat(val) || 0; }));
    form.appendChild(field('Start date', localAm.start, function (val) { localAm.start = val; }));

    function recompute() {
      var fakeLiab = { valuations: item.valuations, amortization: localAm };
      var base = monthlyPayment(localAm.original, localAm.rate, localAm.term);
      var payment = (localAm.customPayment != null && !isNaN(localAm.customPayment)) ? localAm.customPayment : base;
      var totalPayment = payment + (localAm.extra || 0);
      var currentBalance = v.value;
      var kPayoff = payoffMonths(currentBalance, localAm.rate, totalPayment);
      var start = new Date(TODAY + 'T00:00:00');
      var payoffDate = new Date(start.getFullYear(), start.getMonth() + Math.round(kPayoff), start.getDate());
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var derivedLabel = (localAm.customPayment != null && !isNaN(localAm.customPayment)) ? '' : ' (derived)';
      summaryLine.textContent = 'Payment ' + fmtMoney(payment) + '/mo' + derivedLabel + ' + ' + fmtMoney(localAm.extra || 0) + ' extra · Payoff ' + months[payoffDate.getMonth()] + ' ' + payoffDate.getFullYear() + ' · illustrative';
      curveWrap.innerHTML = '';
      var n = Math.max(1, Math.min(360, Math.round(kPayoff)));
      var pts = [];
      for (var i = 0; i <= n; i += Math.max(1, Math.round(n / 24))) {
        pts.push({ date: 'm' + i, value: amortizeBalance(currentBalance, localAm.rate, totalPayment, i) });
      }
      if (pts[pts.length - 1].date !== 'm' + n) pts.push({ date: 'm' + n, value: 0 });
      curveWrap.appendChild(buildSparklineSVG(pts, '--liability'));
    }
    recompute();
    s4.appendChild(form);
    s4.appendChild(summaryLine);
    s4.appendChild(curveWrap);
  }
  frag.appendChild(s4);

  var s5 = h('div', { class: 'drawer-section' });
  s5.appendChild(h('div', { class: 'drawer-label' }, ['Balance History']));
  s5.appendChild(buildSparklineSVG(item.valuations, '--liability'));
  s5.appendChild(buildHistoryTable(item.valuations));
  frag.appendChild(s5);

  var footer = h('div', { class: 'drawer-footer' });
  footer.appendChild(h('button', { class: 'btn-hairline', onclick: function () {
    closeDrawer();
    var tr = qs('tr.item-row[data-id="' + item.id + '"]');
    if (tr) enterEditMode(item, tr.querySelector('.value-cell'));
  } }, ['Record Balance']));
  var archiveNote = h('span', { class: 'archive-note', hidden: true }, ['Not in this prototype']);
  footer.appendChild(h('button', { class: 'stale-btn', onclick: function () {
    archiveNote.hidden = false;
    setTimeout(function () { archiveNote.hidden = true; }, 1500);
  } }, ['Archive']));
  footer.appendChild(archiveNote);
  frag.appendChild(footer);

  return frag;
}

function renderPlanPage(page) {
  var grid = h('div', { class: 'plan-grid' });

  var left = h('div', {});
  left.appendChild(h('div', { class: 'nw-label' }, ['TARGET ALLOCATION']));
  left.appendChild(h('div', { class: 'plan-caption' }, ['Goal share per Asset Class. Compared against actual on the Sheet.']));
  var table = h('table', { class: 'target-table' });
  var thead = h('tr', {});
  thead.appendChild(h('th', {}, ['Class']));
  thead.appendChild(h('th', {}, ['Target %']));
  thead.appendChild(h('th', {}, ['Actual %']));
  thead.appendChild(h('th', {}, ['Gap']));
  table.appendChild(h('thead', {}, [thead]));
  var tbody = h('tbody', {});
  var totalHold = holdingsTotal();
  var totalCell;
  function refreshTotalRow() {
    var sum = ASSET_CLASSES.reduce(function (s, c) { return s + c.target; }, 0);
    var note = '';
    if (sum > 100) note = sum + '% · ' + (sum - 100) + '% over';
    else if (sum < 100) note = sum + '% · ' + (100 - sum) + '% unallocated';
    else note = '100%';
    totalCell.textContent = note;
  }
  ASSET_CLASSES.forEach(function (cls) {
    var tr = h('tr', {});
    tr.appendChild(h('td', {}, [cls.name]));
    var input = h('input', { class: 'target-pct-input', type: 'number', min: '0', max: '100', step: '1' });
    input.value = cls.target;
    input.addEventListener('input', function () {
      cls.target = parseFloat(input.value) || 0;
      var actualPct = totalHold > 0 ? (classTotal(cls) / totalHold) * 100 : 0;
      var gap = (cls.target - actualPct) / 100 * totalHold;
      gapCell.textContent = (gap >= 0 ? '+' : '−') + fmtMoney(Math.abs(gap));
      refreshTotalRow();
    });
    var tdInput = h('td', {});
    tdInput.appendChild(input);
    tr.appendChild(tdInput);
    var actualPct0 = totalHold > 0 ? (classTotal(cls) / totalHold) * 100 : 0;
    tr.appendChild(h('td', { class: 'target-actual' }, [fmtPct(actualPct0)]));
    var gap0 = (cls.target - actualPct0) / 100 * totalHold;
    var gapCell = h('td', { class: 'target-gap' }, [(gap0 >= 0 ? '+' : '−') + fmtMoney(Math.abs(gap0))]);
    tr.appendChild(gapCell);
    tbody.appendChild(tr);
  });
  var totalRow = h('tr', { class: 'target-total-row' });
  totalRow.appendChild(h('td', {}, ['Total']));
  totalCell = h('td', { class: 'target-total-note', colspan: '3' });
  var totalTd = h('td', {});
  totalTd.appendChild(totalCell);
  totalRow.appendChild(totalTd);
  totalRow.appendChild(h('td', {}, []));
  totalRow.appendChild(h('td', {}, []));
  tbody.appendChild(totalRow);
  refreshTotalRow();
  table.appendChild(tbody);
  left.appendChild(table);
  grid.appendChild(left);

  var right = h('div', {});
  right.appendChild(h('div', { class: 'nw-label' }, ['PROJECTION']));
  right.appendChild(h('div', { class: 'plan-caption' }, ['One shared set of assumptions.']));
  var inputsRow = h('div', { class: 'proj-inputs' });
  function projField(labelText, value, onchange) {
    var wrap = h('div', { class: 'proj-field' });
    wrap.appendChild(h('label', {}, [labelText]));
    var input = h('input', { type: 'number' });
    input.value = value;
    input.addEventListener('input', function () { onchange(parseFloat(input.value) || 0); redrawTimeline(); });
    wrap.appendChild(input);
    return wrap;
  }
  inputsRow.appendChild(projField('Growth %/yr', PROJECTION.growth * 100, function (v) { PROJECTION.growth = v / 100; }));
  inputsRow.appendChild(projField('Contribution /month', PROJECTION.contribution, function (v) { PROJECTION.contribution = v; }));
  inputsRow.appendChild(projField('Horizon years', PROJECTION.years, function (v) { PROJECTION.years = v; }));
  right.appendChild(inputsRow);
  var timelineWrap = h('div', { id: 'timeline-wrap' });
  right.appendChild(timelineWrap);
  right.appendChild(h('div', { class: 'proj-footnote' }, ['Illustrative · formula pending reconciliation (ticket 07)']));
  grid.appendChild(right);

  page.appendChild(grid);
  buildTimelineSVG(timelineWrap, true);
  function redrawTimeline() { buildTimelineSVG(timelineWrap, false); }
}

var planTimelineDrawnOnce = false;
function buildTimelineSVG(container, firstRender) {
  container.innerHTML = '';
  var recorded = recordedNetWorthSeries();
  var W = 720, H = 220, padL = 72, padR = 14, padT = 24, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var recordedFrac = 0.35;
  var recordedWidth = plotW * recordedFrac;
  var projectedWidth = plotW * (1 - recordedFrac);
  var todayX = padL + recordedWidth;
  var years = Math.max(1, Math.round(PROJECTION.years));

  var projected = [];
  for (var y = 0; y <= years; y++) projected.push({ year: y, value: projectedNetWorth(y) });

  var allVals = recorded.map(function (p) { return p.value; }).concat(projected.map(function (p) { return p.value; }));
  var minY = Math.min.apply(null, allVals.concat([0]));
  var maxY = Math.max.apply(null, allVals);
  if (maxY === minY) maxY = minY + 1;

  function xRec(i) { return padL + (i / (recorded.length - 1)) * recordedWidth; }
  function xProj(yr) { return todayX + (yr / years) * projectedWidth; }
  function yOf(v) { return padT + plotH - ((v - minY) / (maxY - minY)) * plotH; }

  var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: String(H), preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': 'Net worth, recorded and projected' });

  [minY, maxY].forEach(function (v) {
    var t = svgEl('text', { x: padL - 8, y: yOf(v) + 3, 'text-anchor': 'end', 'font-size': '11', fill: 'var(--text-muted)' });
    t.textContent = fmtMoney(v);
    svg.appendChild(t);
  });

  svg.appendChild(svgEl('line', { x1: todayX, y1: padT, x2: todayX, y2: padT + plotH, stroke: 'var(--border)', 'stroke-width': '1' }));
  var todayLabel = svgEl('text', { x: todayX, y: padT - 8, 'text-anchor': 'middle', 'font-size': '11', fill: 'var(--text-muted)' });
  todayLabel.textContent = 'Today';
  svg.appendChild(todayLabel);

  var startYear = new Date(TODAY + 'T00:00:00').getFullYear();
  for (var yr2 = 5; yr2 <= years; yr2 += 5) {
    var t2 = svgEl('text', { x: xProj(yr2), y: padT + plotH + 16, 'text-anchor': 'middle', 'font-size': '11', fill: 'var(--text-muted)' });
    t2.textContent = String(startYear + yr2);
    svg.appendChild(t2);
  }

  var recPts = recorded.map(function (p, i) { return xRec(i) + ',' + yOf(p.value); }).join(' ');
  var recLine = svgEl('polyline', { points: recPts, fill: 'none', stroke: 'var(--accent)', 'stroke-width': '1.5' });
  svg.appendChild(recLine);

  var projPts = projected.map(function (p) { return xProj(p.year) + ',' + yOf(p.value); }).join(' ');
  var projLine = svgEl('polyline', { points: projPts, fill: 'none', stroke: 'var(--accent)', 'stroke-width': '1.25', 'stroke-dasharray': '4 3' });
  svg.appendChild(projLine);

  var info = mortgagePayoffInfo();
  if (info) {
    var payoffYearsFrac = info.payoffMonths / 12;
    if (payoffYearsFrac <= years) {
      var payoffVal = projectedNetWorth(payoffYearsFrac);
      var pax = xProj(payoffYearsFrac), pay = yOf(payoffVal);
      svg.appendChild(svgEl('circle', { cx: pax, cy: pay, r: '4', fill: 'var(--bg)', stroke: 'var(--accent)', 'stroke-width': '1.5' }));
      var payoffLabel = svgEl('text', { x: Math.min(pax + 8, W - padR - 4), y: pay - 8, 'text-anchor': pax > W - padR - 110 ? 'end' : 'start', 'font-size': '11', fill: 'var(--text-muted)' });
      payoffLabel.textContent = 'Mortgage paid off · ' + info.payoffDate.getFullYear();
      svg.appendChild(payoffLabel);
    }
  }

  var endVal = projected[projected.length - 1].value;
  var endX = xProj(years), endY = yOf(endVal);
  svg.appendChild(svgEl('circle', { cx: endX, cy: endY, r: '3', fill: 'var(--accent)' }));
  var endLabel = svgEl('text', { x: endX - 8, y: endY - 8, 'text-anchor': 'end', 'font-size': '13', fill: 'var(--text)' });
  endLabel.textContent = (startYear + years) + ' · ' + fmtMoney(endVal);
  svg.appendChild(endLabel);

  container.appendChild(svg);

  if (firstRender && !planTimelineDrawnOnce && !reducedMotion()) {
    planTimelineDrawnOnce = true;
    requestAnimationFrame(function () {
      try {
        var len = recLine.getTotalLength();
        if (!len || !isFinite(len)) throw new Error('no length');
        recLine.style.strokeDasharray = String(len);
        recLine.style.strokeDashoffset = String(len);
        recLine.getBoundingClientRect();
        recLine.style.transition = 'stroke-dashoffset 600ms ease-out';
        requestAnimationFrame(function () { recLine.style.strokeDashoffset = '0'; });
      } catch (err) { recLine.style.strokeDasharray = ''; recLine.style.strokeDashoffset = ''; }
    });
  }
}

/* ============================================================
   "Why this design" notes panel (reuses the drawer shell)
   ============================================================ */
var NOTES = [
  { title: 'One page is the Portfolio', body: 'A monthly check-in plus a handful of distribution-only glances a month, over data small enough to see whole, doesn’t need a tree to drill through or tabs to switch between — it needs one page you can scan top to bottom. A balance sheet keeps every Holding and Liability, and the totals they roll up to, in one continuous view instead of splitting the picture across screens.' },
  { title: 'Check-in is a mode, not a page', body: 'Recording Valuations is a periodic ritual, not a permanent way of looking at the sheet. Turning it into a mode over the same rows — rather than a separate flow — means you never lose your place, and leaving it (Esc, Leave, or the last row) returns you to the exact page you started from.' },
  { title: 'Distribution on the first screen', body: 'Allocation drift is the thing worth noticing without asking for it, so it sits beside Net Worth on load rather than a tab or a chart you have to navigate to. Bars scaled to the largest value, not to 100%, keep the comparison to target readable even when classes are small.' },
  { title: 'Liabilities as their own group', body: 'Debt behaves differently from what you own — it has its own amortization math, its own payoff horizon — so it gets its own block in the sheet and its own row color, rather than being folded into Asset Classes as negative Holdings.' },
  { title: 'Nothing colored red or green', body: 'A stale Valuation, a liability, a gap above or below target: none of it is good or bad on its face, so none of it is colored to imply judgment. Staleness reads as reduced opacity, gaps read as words (“above” / “below”), and Liabilities read as a distinct neutral hue — information without a verdict.' },
  { title: 'Illustrative projection', body: 'The Plan page projects Holdings forward with a fixed growth/contribution assumption and nets out Liabilities, but the formula for reconciling amortized and flat debt against that projection is still open (ticket 07). The label says so, plainly, rather than presenting a number with more confidence than the math behind it currently earns.' }
];
function renderNotesPanel() {
  var body = h('div', { class: 'notes-body' });
  NOTES.forEach(function (n) {
    body.appendChild(h('h3', {}, [n.title]));
    body.appendChild(h('p', {}, [n.body]));
  });
  return body;
}

  qs('#scrim').classList.add('show');

});
